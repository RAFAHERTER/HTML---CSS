<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 6</title>
</head>
<body>
    <h1>Tags em HTML</h1>
        <p>
            Em HTML5, podemos inserir os elementos da Lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.
        </p>

        <ul type="square">
            <li><abbr title="Usa-se a tag <p>">Parágrafos</abbr></li>
            <li><abbr title="Usa-se a tag <h1,h2,h3...h6>">Títulos</abbr></li>
            <li><abbr title="Usa-se a tag <img>">Imagens</abbr></li>
            <li><abbr title="Usa-se a tag <code> ou <pre>">Código-fonte</abbr></li>
            <li><abbr title="Usa-se a tag <en>">Itálico</abbr></li>
            <li><abbr title="Usa-se a tag <ins>">Texto inserido</abbr></li>
            <li><abbr title="Usa-se a tag <strong>">Negrito</abbr></li>
            <li><abbr title="Usa-se a tag <q>">Citações simples</abbr></li>
            <li><abbr title="Usa-se a tag <blockquote>">Citações Completas</abbr></li>
        </ul> 
</body>
</html>
