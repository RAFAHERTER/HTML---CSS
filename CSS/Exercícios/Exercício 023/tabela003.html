<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>    <!-- Existem expansões para linhas e expansões para colunas. Nesse caso, a célula B irá ocupar duas colunas. Pra isso será utilizado o atributo colspan. Para expansões de linhas, será utilizado o atributo rowspan. -->
            <td>A</td>
            <td colspan="2">B</td>
        </tr>

        <tr>
            <td>D</td>
            <td colspan="2" rowspan="3">E</td>
            
        </tr>
            <td>G</td>
            
        <tr>
            <td>J</td>
            
        </tr>

        <tr>
            <td>M</td>
            <td>N</td>
            <td>O</td>
        </tr>
    </table>
</body>
</html>
