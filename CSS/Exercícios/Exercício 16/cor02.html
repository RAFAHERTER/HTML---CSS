<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            height: 100%;
        }
        
        body{
            background-image: linear-gradient(to right,#FA1418,#FAF631, #7A7A47);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
        <p>Para fazer degradê, usa-se a tag &lt; background-image&gt;, depois escreve a direção que deseja: "to right", "to left", "to top", "to bottom"</p>
        <p>
            Também existe as configurações globais que existem nas CSS.
        </p>
        <p>
            Também podemos colocar várias cores dentro do degradê.
        </p>
</body>
</html>
