<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        
        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: darkgray;
            border-radius: 10px;

            border: 10px solid darkgray;
            /* 
            Short Hand
            */
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            padding: 10px 10px 10px 10px; /*São exatamente iguais, portanto */
            padding: 10px;

            margin: 10px auto;

            
/*
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
*/


            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

            outline: 5px solid salmon;
        }

        a{
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            border-radius: 10px;
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa BOX - LEVEL</h1>
        <p>
            Os parágrafos também são exemplos de box-level, mas os <a href="#">links</a> são exemplos de caixas Inline-level
        </p>
</body>
</html>
