<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #conteiner{
            position: relative;
            height: 96vh;
            background-color: purple;
            padding: 10px;
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
        }

        #conteudo{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            /* 

            O margin auto, serve apenas para o alinhamento automático horizontal do conteúdo ao centro. Porém para fazer o mesmo alinhamento VERTICAL é necessário fazer de outra forma.

            Para isso é necessário que o "conteiner" tenha uma posição relativa e o "conteudo" (que está dentro) tem que ter um posicionamento absoluto.
            (SIM, ISTO É UMA REGRA, O DE FORA TEM QUE SER RELATIVO, E O DE DENTRO TEM QUE SER ABSOLUTO)

            Depois é necessário colocar left e top 50%, pois assim, eles estarão sendo gerados a partir da metade do alinhamento.

            Porém, não necessáriamente será alinhado ao centro diretamente. É necessário transformar com "transform" para mudar o posicionamento com "translate".
            
            Depois disso, é necessário colocar -50% (esquerda) e -50% (cima) e assim estará alinhado, conforme o resultado gerado no site.
            */
        }
    </style>
</head>
<body>
    <section id="conteiner">

        <article id="conteudo">

        </article>

    </section>
</body>
</html>
